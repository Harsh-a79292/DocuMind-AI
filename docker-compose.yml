services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: documind-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: documind-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
